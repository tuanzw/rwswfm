<!-- templates/partials/navbar.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <i class="bi bi-bookmark-check me-2"></i>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
      aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto">
        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/teams/' %}active{% endif %}" href="{% url 'add_team' %}">
            <i class="bi bi-people"></i> Teams
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/carriers/' %}active{% endif %}" href="{% url 'add_carrier' %}">
            <i class="bi bi-truck"></i> Carriers
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/users/' %}active{% endif %}" href="{% url 'add_user' %}">
            <i class="bi bi-person"></i> Users
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/tasks/' %}active{% endif %}" href="{% url 'add_task' %}">
            <i class="bi bi-list-task"></i> Tasks
          </a>
        </li>
        {% endif %}
      </ul>

      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown"
            aria-expanded="false">
            <i class="bi bi-person-circle me-1"></i>
            {{ user.username }}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li><a class="dropdown-item" href="/profile/">
                <i class="bi bi-person me-2"></i>Profile
              </a></li>
            <li><a class="dropdown-item" href="/settings/">
                <i class="bi bi-gear me-2"></i>Settings
              </a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li>
              <a class="dropdown-item text-danger" href="#" hx-post="{% url 'logout' %}" hx-push-url="true"
                hx-target="body">
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </a>
            </li>
          </ul>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
